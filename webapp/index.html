<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreeTV</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>

    <!-- Browsing -->
    <div id="browser">
      <header id="topbar">
        <img id="logo" src="logo.png" alt="">
        <div id="crumb"></div>
        <div id="clock"></div>
      </header>

      <div id="loadbar" hidden><i></i></div>

      <div id="main">
        <nav id="rail"></nav>
        <section id="content"></section>
      </div>
    </div>

    <!-- Playback -->
    <div id="player" hidden>
      <video id="video" playsinline webkit-playsinline></video>

      <div id="osd">
        <div class="osd-bottom">
          <div class="osd-line">
            <div id="osd-name"></div>
            <div id="osd-state"></div>
          </div>
          <div id="osd-sub"></div>
          <div class="bar"><i id="osd-fill"></i></div>
          <div class="times">
            <span id="osd-pos"></span>
            <span id="osd-dur"></span>
          </div>
        </div>
      </div>

      <div id="spinner" hidden><i></i></div>
    </div>

    <!-- Overlays -->
    <div id="toast" hidden></div>
    <div id="diag" hidden></div>

    <script src="config.js"></script>
    <script src="freetv.js"></script>
    <script src="input.js"></script>
    <script src="app.js"></script>
  </body>
</html>
